name: Update visual snapshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx -w @rbac/web playwright install --with-deps chromium firefox webkit

      - name: Regenerate snapshots
        run: npm run test:e2e -w @rbac/web -- performance-visual.spec.js --update-snapshots

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/e2e/*-snapshots
          git diff --cached --quiet || git commit -m "test(web): update linux visual snapshots"
          git push
